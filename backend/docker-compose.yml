services:
  mongodb:
    image: mongo:8
    container_name: zonify-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: zonify-backend
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/zonify
      BACKEND_PORT: 4000
      BACKEND_HOST: 0.0.0.0
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
